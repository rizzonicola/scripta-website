name: Update releases.json

on:
  # 1) Esecuzione programmata ogni 6 ore
  schedule:
    - cron: '0 */6 * * *'
  # 2) A new Scripta release, sent by the Scripta release workflow once all builds are done
  repository_dispatch:
    types: [scripta-release]
  # 3) This workflow file itself is edited
  push:
    paths:
      - ".github/workflows/update-releases.yml"
  # 4) Manual run (Actions tab), handy for the very first run
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update-releases
  cancel-in-progress: false

env:
  SOURCE_REPO: rizzonicola/Scripta
  EXPECTED_ASSETS: 10   # files per release: 4 APK, IPA, DMG, ZIP, 2 EXE, flatpak

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Fetch releases (waits until the latest one is complete)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          for i in $(seq 1 10); do
            curl -fsSL \
              -H "Accept: application/vnd.github+json" \
              -H "Authorization: Bearer $GH_TOKEN" \
              "https://api.github.com/repos/$SOURCE_REPO/releases?per_page=30" \
            | jq '[.[] | select(.draft == false and .prerelease == false)
                   | {tag_name, name, published_at, html_url,
                      assets: [.assets[] | {name, size, digest, browser_download_url}]}]' \
            > releases.tmp

            COUNT=$(jq '.[0].assets | length' releases.tmp)
            echo "Attempt $i: latest release has $COUNT assets (expected $EXPECTED_ASSETS)"
            if [ "$COUNT" -ge "$EXPECTED_ASSETS" ]; then
              mv releases.tmp releases.json
              exit 0
            fi
            sleep 30
          done
          echo "::error::Latest release is still incomplete, keeping the previous releases.json"
          exit 1

      - name: Update static SEO snapshot (version/date, per language)
        run: |
          TAG=$(jq -r '.[0].tag_name' releases.json)
          DATE=$(jq -r '.[0].published_at | split("T")[0]' releases.json)
          for f in it/releases/index.html en/releases/index.html fr/releases/index.html; do
            sed -i -E "s#(<span id=\"sw-version\">)[^<]*(</span>)#\1${TAG}\2#" "$f"
            sed -i -E "s#(<span id=\"sw-date\">)[^<]*(</span>)#\1${DATE}\2#" "$f"
          done
          # softwareVersion nel JSON-LD SoftwareApplication (home page, 3 lingue)
          for f in it/index.html en/index.html fr/index.html it/releases/index.html en/releases/index.html fr/releases/index.html; do
            if grep -q '"softwareVersion"' "$f"; then
              sed -i -E "s#\"softwareVersion\": ?\"[^\"]*\"#\"softwareVersion\": \"${TAG}\"#" "$f"
            fi
          done

      - name: Commit if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add releases.json it/releases/index.html en/releases/index.html fr/releases/index.html \
                   it/index.html en/index.html fr/index.html
          git diff --cached --quiet || (git commit -m "chore: update releases.json and version snapshot" && git push)
